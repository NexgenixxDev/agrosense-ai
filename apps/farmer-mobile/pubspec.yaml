name: agrosense_farmer
description: AgroSense crop support for Namibian farmers.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.10.3
dependencies:
  flutter:
    sdk: flutter
  http: 1.5.0
  image_picker: 1.2.0
  sqflite: 2.4.2
  path_provider: 2.1.5
  # Keep platform-channel implementations compatible with this Flutter toolchain.
  path_provider_android: 2.2.22
  path_provider_foundation: 2.4.2
  uuid: 4.5.1
  flutter_secure_storage: 9.2.4
  flutter_local_notifications: 19.5.0
  timezone: 0.10.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  sqflite_common_ffi: 2.3.6
  sqlite3: 2.9.4
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  # Nunito (SIL Open Font License, assets/fonts/OFL.txt): static weights
  # generated from the variable font with fontTools varLib.instancer.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
